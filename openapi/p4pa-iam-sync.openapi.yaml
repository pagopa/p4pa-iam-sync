openapi: 3.0.1
info:
  title: p4pa-iam-sync
  description: Api and Models
  version: "1.0.0"
paths:
  /api/v1/greet:
    get:
      summary: "Hello World"
      description: "Sample endpoint that return greetings"
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Hello, World!"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
components:
  schemas:
    ErrorDTO:
      type: object
      required:
        - category
        - code
        - message
      properties:
        category:
          type: string
          enum:
            - NOT_FOUND
            - BAD_REQUEST
            - GENERIC_ERROR
            - TOO_MANY_REQUESTS
            - CONFLICT
            - FORBIDDEN
            - UNAUTHORIZED
        code:
          type: string
        message:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ErrorFieldDTO"
        traceId:
          type: string
    ErrorFieldDTO:
      type: object
      required:
        - field
        - error
        - message
      properties:
        field:
          type: string
        error:
          type: string
        message:
          type: string
